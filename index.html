<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🇧🇷 Brasil 3D — Comunidade</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Three.js e Firebase -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "firebase": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <h1>🇧🇷 Brasil 3D</h1>
    <p>Siga <strong>@seu_instagram</strong> e comente sua <strong>cidade</strong>!</p>
    <div id="stats">
      <span id="totalCasas">0 casas</span> ·
      <span id="totalBarco">0 no barco</span>
    </div>
  </div>

  <button id="btnVoz" class="btn-float">🔊 Ativar Voz</button>

  <!-- PAINEL DO NAVIO (CHAT E CUSTOMIZAÇÃO) -->
  <div id="ship-ui">
    <div id="ship-header">
      <span>⚓ Navio Interativo (Global)</span>
      <button style="background:none;border:none;color:#fff;cursor:pointer;" onclick="document.getElementById('ship-ui').classList.remove('active')">✖</button>
    </div>
    
    <!-- Chat -->
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Digite sua mensagem..." />
      <button id="chat-send">Enviar</button>
    </div>

    <div style="padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
      <button id="btn-pixar" style="width:100%; background:#eab308; color:#000; font-weight:bold; border:none; padding:8px; border-radius:6px; cursor:pointer; margin-bottom:8px;">🎨 Pixar Navio</button>
      <button id="btn-cartaz" style="width:100%; background:#3b82f6; color:#fff; font-weight:bold; border:none; padding:8px; border-radius:6px; cursor:pointer;">🖼️ Colocar Cartaz</button>
    </div>
  </div>

  <!-- PAINEL DE CUSTOMIZAÇÃO (ROBLOX) -->
  <div id="customize-panel">
    <h3>Personalizar Boneco</h3>
    <label>Cor da Camisa:</label>
    <input type="color" id="color-shirt" value="#3b82f6" />
    <label>Cor da Pele:</label>
    <input type="color" id="color-skin" value="#ffcc99" />
    <button id="save-custom">Salvar</button>
  </div>

  <div id="legenda">
    <button data-regiao="Norte">Norte</button>
    <button data-regiao="Nordeste">Nordeste</button>
    <button data-regiao="Centro-Oeste">Centro-Oeste</button>
    <button data-regiao="Sudeste">Sudeste</button>
    <button data-regiao="Sul">Sul</button>
    <button data-regiao="BRASIL" class="btn-brasil">🇧🇷 Brasil</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando Brasil 3D...</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
