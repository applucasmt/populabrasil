<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🇧🇷 Brasil 3D — Comunidade</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
  <link rel="stylesheet" href="style.css" />
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <h1>🇧🇷 Brasil 3D</h1>
    <p>Siga <strong>@seu_instagram</strong> e comente sua <strong>cidade</strong>!</p>
    <div id="stats">
      <span id="totalCasas">0 casas</span> ·
      <span id="totalBarco">0 no barco</span>
    </div>
  </div>

  <button id="btnVoz" class="btn-float">🔊 Ativar Voz</button>

  <!-- PAINEL DO NAVIO -->
  <div id="ship-ui">
    <div id="ship-header">
      <span>⚓ Navio Interativo (ESC para sair)</span>
      <button style="background:none;border:none;color:#fff;cursor:pointer;" onclick="fecharNavio()">✖</button>
    </div>
    
    <div style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.75rem; color: #94a3b8; text-align: center;">
      <strong>Atalhos:</strong> [T] Chat | [P] Spray | [I] Cartaz
    </div>

    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Digite sua mensagem..." />
      <button id="chat-send">Enviar</button>
    </div>

    <div style="padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 8px;">
      
      <!-- Controles de Spray -->
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="color" id="color-picker" value="#ff0000" style="width: 40px; height: 40px; border: none; border-radius: 6px; cursor: pointer;" title="Escolha a cor do Spray" />
        <button id="btn-pixar" style="flex:1; background:#eab308; color:#000; font-weight:bold; border:none; padding:8px; border-radius:6px; cursor:pointer;">🎨 Ativar Spray</button>
      </div>

      <!-- Upload de Imagem (Cartaz) -->
      <input type="file" id="file-cartaz" accept="image/*" style="display: none;" />
      <button id="btn-cartaz" style="width:100%; background:#3b82f6; color:#fff; font-weight:bold; border:none; padding:8px; border-radius:6px; cursor:pointer;">🖼️ Enviar Imagem</button>
    </div>
  </div>

  <div id="legenda">
    <button data-regiao="Norte">Norte</button>
    <button data-regiao="Nordeste">Nordeste</button>
    <button data-regiao="Centro-Oeste">Centro-Oeste</button>
    <button data-regiao="Sudeste">Sudeste</button>
    <button data-regiao="Sul">Sul</button>
    <button data-regiao="BRASIL" class="btn-brasil">🇧🇷 Brasil</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando mapa real do Brasil...</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
