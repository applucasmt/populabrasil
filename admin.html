<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>⚙️ Admin — Brasil 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin">
  <div class="admin-container">
    <a href="index.html" class="voltar">← Voltar ao mapa</a>
    <h1>⚙️ Adicionar Morador</h1>

    <label>Nome completo</label>
    <input id="nome" placeholder="Ex: João Silva" />

    <label>Usuário (Instagram/Facebook/TikTok)</label>
    <input id="usuario" placeholder="Ex: @joaosilva" />

    <label>Cidade</label>
    <input id="cidade" placeholder="Ex: São Paulo" />

    <label>Estado (UF)</label>
    <select id="uf">
      <option value="">— Selecione —</option>
      <option>AC</option><option>AL</option><option>AM</option><option>AP</option>
      <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
      <option>GO</option><option>MA</option><option>MG</option><option>MS</option>
      <option>MT</option><option>PA</option><option>PB</option><option>PE</option>
      <option>PI</option><option>PR</option><option>RJ</option><option>RN</option>
      <option>RO</option><option>RR</option><option>RS</option><option>SC</option>
      <option>SE</option><option>SP</option><option>TO</option>
    </select>

    <label>URL da foto</label>
    <input id="foto" placeholder="assets/joao.jpg ou URL" />

    <label>
      <input type="checkbox" id="comentou" checked style="width:auto;margin-right:8px;" />
      Comentou a região (ganha casa) — desmarque para o barco
    </label>

    <button id="btnGerar">📋 Gerar JSON do morador</button>
    <div id="preview" style="display:none;"></div>

    <div class="aviso">
      <strong>⚠️ Como usar:</strong><br/>
      1. Preencha os dados<br/>
      2. Clique em "Gerar JSON"<br/>
      3. Copie o resultado<br/>
      4. Cole em <code>data/moradores.json</code> no GitHub<br/>
      5. Commit → site atualiza em ~1 min
    </div>
  </div>

  <script>
    // Mapa de capitais para preencher lat/lon automático
    const CAPITAIS = {
      AC:[-9.97,-67.81],AL:[-9.66,-35.73],AM:[-3.10,-60.02],AP:[0.03,-51.07],
      BA:[-12.97,-38.50],CE:[-3.73,-38.52],DF:[-15.79,-47.88],ES:[-20.31,-40.31],
      GO:[-16.68,-49.25],MA:[-2.53,-44.30],MG:[-19.92,-43.94],MS:[-20.44,-54.64],
      MT:[-15.60,-56.10],PA:[-1.45,-48.50],PB:[-7.11,-34.86],PE:[-8.05,-34.88],
      PI:[-5.08,-42.80],PR:[-25.42,-49.27],RJ:[-22.90,-43.20],RN:[-5.79,-35.20],
      RO:[-8.76,-63.90],RR:[2.82,-60.67],RS:[-30.03,-51.22],SC:[-27.59,-48.55],
      SP:[-23.55,-46.63],SE:[-10.91,-37.07],TO:[-10.18,-48.33]
    };

    document.getElementById('btnGerar').addEventListener('click', () => {
      const uf = document.getElementById('uf').value;
      const cidade = document.getElementById('cidade').value.trim();
      const coord = CAPITAIS[uf] || [null, null];

      const morador = {
        nome: document.getElementById('nome').value.trim(),
        usuario: document.getElementById('usuario').value.trim(),
        cidade: cidade || null,
        uf: uf || null,
        lat: coord[0],
        lon: coord[1],
        foto: document.getElementById('foto').value.trim(),
        comentou: document.getElementById('comentou').checked
      };

      if (!morador.nome || !morador.usuario) {
        alert('Preencha nome e usuário!');
        return;
      }

      const preview = document.getElementById('preview');
      preview.style.display = 'block';
      preview.textContent = JSON.stringify(morador, null, 2);

      const btn = document.createElement('button');
      btn.textContent = '📋 Copiar JSON';
      btn.style.marginTop = '12px';
      btn.onclick = () => {
        navigator.clipboard.writeText(preview.textContent);
        btn.textContent = '✅ Copiado!';
        setTimeout(() => btn.textContent = '📋 Copiar JSON', 1500);
      };
      // remove botão antigo se houver
      preview.querySelectorAll('button').forEach(b => b.remove());
      preview.appendChild(btn);
    });
  </script>
</body>
</html>
